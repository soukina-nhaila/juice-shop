name: SAST - Semgrep

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  semgrep:
    name: Analyse de sécurité du code
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code source
        uses: actions/checkout@v6

      - name: Installer Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Installer Semgrep
        run: python -m pip install semgrep

      - name: Lancer l'analyse SAST
        run: |
          semgrep scan \
            --config auto \
            --exclude node_modules \
            --exclude dist \
            --exclude coverage \
            .
